plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}

group = 'expo.modules.nativeliquidtabs'
version = '0.1.0'

android {
  namespace "expo.modules.nativeliquidtabs"
  buildFeatures {
    compose true
  }
  kotlinOptions {
    freeCompilerArgs += [
      "-Xcontext-parameters"
    ]
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// @expo/ui ships its Android library in a local Maven folder holding only its own version, so
// depend on the version the app has installed instead of a fixed one.
def expoUiPackageJson = new File(
  ["node", "--print", "require.resolve('@expo/ui/package.json')"].execute(null, rootDir).text.trim()
)
def expoUiVersion = new groovy.json.JsonSlurper().parse(expoUiPackageJson).version

repositories {
  maven {
    url(new File(expoUiPackageJson.parentFile, "local-maven-repo"))
  }
}

dependencies {
  implementation("expo.modules.ui:expo.modules.ui:${expoUiVersion}")
  implementation("androidx.activity:activity-compose:1.12.3")
  implementation("androidx.compose.animation:animation-core:1.11.1")
  implementation("androidx.compose.foundation:foundation:1.11.1")
  implementation("androidx.compose.material3:material3:1.5.0-alpha17")
  implementation("androidx.compose.runtime:runtime:1.11.1")
  implementation("androidx.compose.ui:ui:1.11.1")
}
